<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV データ可視化ツール — Benesse TW</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#fff;--bg2:#f7f6f3;--bg3:#efede8;
  --text1:#1a1916;--text2:#6b6860;--text3:#9c9a94;
  --border:#e2dfd8;--border2:#ccc9c0;
  --green:#1d7a5f;--green-bg:#edf5f2;
  --amber:#96600a;--amber-bg:#fdf4e7;
  --red:#b83a2e;--red-bg:#fdf0ee;
  --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Noto Sans CJK JP","Noto Sans TC",sans-serif;
  --mono:"SF Mono","Menlo","Consolas","Courier New",monospace;
  --m-pink:#FFB7C5;--m-peach:#FFDBA4;--m-lemon:#FFF4A3;
  --m-mint:#B5EAD7;--m-lavender:#C7CEEA;--m-sky:#AED6F1;
  --c-learn:#A8C5DA;--c-learn-d:#4A7A9B;
  --c-license:#C5B4E3;--c-license-d:#7A5AAB;
  --c-around:#A8D5B5;--c-around-d:#3A8A55;
  --c-mira:#F5D4A0;--c-mira-d:#C07820;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg3);color:var(--text1);font-family:var(--font);font-size:12.5px;min-height:100vh}

.sticky{
  position:sticky;top:0;z-index:200;background:var(--bg);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:12px;padding:10px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06)
}
.sticky-logo{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.1em}
.sticky-title{flex:1;font-size:13px;font-weight:500;color:var(--text1)}
.lang-toggle{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:2px}
.lang-btn{padding:3px 10px;border-radius:3px;border:none;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:500;color:var(--text2);background:none;transition:background .15s,color .15s}
.lang-btn.active{background:var(--m-lavender);color:#333}

.wrap{max-width:1100px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--border);min-height:calc(100vh - 45px)}
.layout{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 45px)}

.sidebar{border-right:1px solid var(--border);background:var(--bg2);overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.sidebar-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}

.drop-zone{border:1.5px dashed var(--border2);border-radius:6px;padding:18px 12px;text-align:center;cursor:pointer;background:var(--bg);position:relative;overflow:hidden;transition:border-color .2s,background .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--c-learn-d);background:#f0f6fa}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop-icon{font-size:22px;margin-bottom:5px}
.drop-text{font-size:11.5px;color:var(--text2);line-height:1.6}
.drop-text strong{color:var(--c-learn-d);font-weight:600}

.file-list{display:flex;flex-direction:column;gap:3px}
.file-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:5px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.file-item:hover{background:var(--bg3)}
.file-item.active{background:rgba(168,197,218,.18);border-color:rgba(74,122,155,.28)}
.file-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .15s}
.file-item.active .file-dot{background:var(--c-learn-d)}
.file-name{font-size:11.5px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item.active .file-name{color:var(--text1);font-weight:500}
.file-rows{font-family:var(--mono);font-size:10px;color:var(--text3);flex-shrink:0}
.file-remove{width:15px;height:15px;border-radius:50%;background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity .15s}
.file-item:hover .file-remove{opacity:1}
.file-remove:hover{color:var(--red)}

.main{overflow-y:auto;background:var(--bg)}

.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text2);text-align:center;padding:40px}
.welcome-icon{font-size:44px;opacity:.4}
.welcome h2{font-size:17px;color:var(--text1);font-weight:500}
.welcome p{font-size:12.5px;line-height:1.7;max-width:340px;color:var(--text2)}

.content{padding:22px 20px 32px}

.file-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.file-title h2{font-size:16px;font-weight:500;color:var(--text1);margin-bottom:5px}
.file-meta{display:flex;gap:14px;flex-wrap:wrap}
.meta-chip{font-family:var(--mono);font-size:11px;color:var(--text3)}
.meta-chip span{color:var(--text2)}

nav.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;flex-wrap:nowrap}
.tab-btn{padding:8px 16px;font-size:12.5px;font-family:var(--font);color:var(--text2);cursor:pointer;white-space:nowrap;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
.tab-btn:hover{color:var(--text1)}
.tab-btn.active{color:var(--text1);border-bottom-color:var(--m-mint);background:rgba(181,234,215,.12)}

.kpi-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:20px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.kpi-label{font-size:11px;color:var(--text3);margin-bottom:3px}
.kpi-value{font-family:var(--mono);font-size:22px;font-weight:300;letter-spacing:-.02em;color:var(--text1)}
.kpi-value.cn{color:var(--c-learn-d)}.kpi-value.cs{color:var(--c-license-d)}.kpi-value.cd{color:var(--c-around-d)}.kpi-value.cw{color:var(--red)}

.section-title{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px}

.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;margin-bottom:20px}
.col-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 14px;transition:border-color .15s}
.col-card:hover{border-color:var(--border2)}
.col-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.col-name{font-size:12.5px;font-weight:500;color:var(--text1);flex:1;min-width:0;word-break:break-all}
.col-type{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:3px;flex-shrink:0}
.type-num{background:rgba(245,212,160,.3);color:var(--c-mira-d);border:1px solid rgba(192,120,32,.2)}
.type-str{background:rgba(168,197,218,.3);color:var(--c-learn-d);border:1px solid rgba(74,122,155,.2)}
.type-date{background:rgba(168,213,181,.3);color:var(--c-around-d);border:1px solid rgba(58,138,85,.2)}
.type-bool{background:rgba(197,180,227,.3);color:var(--c-license-d);border:1px solid rgba(122,90,171,.2)}

.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.bar-lbl{font-size:11px;color:var(--text3);width:46px;flex-shrink:0}
.bar-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .5s ease}
.fill-null{background:var(--red)}.fill-unique{background:var(--c-learn)}
.bar-pct{font-family:var(--mono);font-size:10px;color:var(--text3);width:34px;text-align:right;flex-shrink:0}

.samples{margin-top:7px;display:flex;flex-wrap:wrap;gap:3px}
.sample-val{font-size:11px;padding:2px 6px;background:var(--bg2);border-radius:3px;color:var(--text2);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.chart-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px 14px 10px}
.chart-box-title{font-size:11.5px;color:var(--text2);margin-bottom:10px;font-weight:500}
.chart-box-sub{font-family:var(--mono);font-size:10px;color:var(--text3);display:flex;gap:12px;margin-top:7px}
.fallback-msg{font-size:11px;color:var(--amber);padding:4px 0 6px}

.hm-section{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:16px}
.hm-section h3{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.hm-row{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.hm-col{font-size:12px;color:var(--text2);width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.hm-track{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.hm-fill{height:100%;border-radius:4px;transition:width .5s ease}
.hm-pct{font-family:var(--mono);font-size:10px;color:var(--text3);width:40px;text-align:right;flex-shrink:0}

table.std{width:100%;border-collapse:collapse;background:var(--bg)}
table.std th{font-size:11px;font-weight:400;color:var(--text3);text-align:left;padding:8px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;background:var(--bg2);z-index:5}
table.std td{padding:7px 8px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
table.std td.num,table.std th.num{font-family:var(--mono);text-align:right;white-space:nowrap}
table.std tr:hover td{background:var(--bg2)}
table.std tr:nth-child(even) td{background:rgba(247,246,243,.6)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:6px;max-height:460px}

.search-row{display:flex;gap:9px;margin-bottom:14px;align-items:center}
.search-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:7px 12px;color:var(--text1);font-size:12.5px;font-family:var(--font);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--c-learn-d)}
.search-input::placeholder{color:var(--text3)}
.search-info{font-family:var(--mono);font-size:11px;color:var(--text3)}

.pagination{display:flex;align-items:center;gap:7px;padding:12px 0 0;justify-content:flex-end}
.page-btn{padding:4px 11px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s;font-family:var(--font)}
.page-btn:hover:not(:disabled){border-color:var(--c-learn-d);color:var(--c-learn-d)}
.page-btn:disabled{opacity:.3;cursor:not-allowed}
.page-info{font-family:var(--mono);font-size:11px;color:var(--text3)}

.tab-content{display:none}.tab-content.active{display:block}

.insight{margin-top:24px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.insight-header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;background:var(--bg2);font-size:12.5px;font-weight:500;color:var(--text2);user-select:none}
.insight-header:hover{background:var(--bg3)}
.insight-arrow{font-size:10px;transition:transform .2s;display:inline-block}
.insight-body{padding:14px 16px;font-size:12px;line-height:1.8;color:var(--text2);display:none}
.insight.open .insight-body{display:block}
.insight.open .insight-arrow{transform:rotate(90deg)}

/* ── JOIN panel ── */
.join-panel{padding:22px 20px 32px}
.join-panel h2{font-size:15px;font-weight:500;color:var(--text1);margin-bottom:4px}
.join-panel .sub{font-size:12px;color:var(--text3);margin-bottom:20px}
.join-block{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.join-block h3{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:12px;letter-spacing:.03em}
.join-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.join-row label{font-size:11.5px;color:var(--text2);width:80px;flex-shrink:0}
.join-select{flex:1;min-width:140px;padding:6px 10px;border:1px solid var(--border2);border-radius:5px;font-family:var(--font);font-size:12px;color:var(--text1);background:var(--bg);outline:none;cursor:pointer}
.join-select:focus{border-color:var(--c-learn-d)}
.join-type-group{display:flex;gap:6px}
.jtype-btn{padding:5px 14px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);font-family:var(--font);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.jtype-btn.active{background:var(--m-mint);border-color:var(--c-around-d);color:#1a1916;font-weight:500}
.join-run-btn{padding:8px 22px;background:var(--c-learn-d);color:#fff;border:none;border-radius:5px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.join-run-btn:hover{background:#3a6a8a}
.join-run-btn:disabled{background:var(--text3);cursor:not-allowed}
.join-result-info{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:12px 16px;background:var(--green-bg);border:1px solid rgba(29,122,95,.2);border-radius:6px}
.join-result-info .ri{font-size:12px;color:var(--green)}
.join-result-info .ri strong{font-family:var(--mono);font-size:14px}
.join-warn{padding:10px 14px;background:var(--amber-bg);border:1px solid rgba(150,96,10,.2);border-radius:6px;font-size:12px;color:var(--amber);margin-bottom:12px}
.dl-btn{padding:6px 16px;border:1px solid var(--c-learn-d);border-radius:4px;background:var(--bg);color:var(--c-learn-d);font-family:var(--font);font-size:12px;cursor:pointer;transition:all .15s}
.dl-btn:hover{background:var(--c-learn-d);color:#fff}
.sidebar-join-btn{width:100%;padding:8px;background:var(--m-peach);border:1px solid rgba(150,100,0,.2);border-radius:5px;font-family:var(--font);font-size:12px;font-weight:500;color:#5a3a00;cursor:pointer;transition:all .15s;text-align:center}
.sidebar-join-btn:hover{background:#f5ca80}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

@media(max-width:768px){
  .layout{grid-template-columns:1fr;height:auto}
  .sidebar{height:auto;max-height:220px}
  .content{padding:14px}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="sticky">
  <div class="sticky-logo">BENESSE / TW</div>
  <div class="sticky-title" data-i18n="header_title">CSV データ可視化ツール</div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" onclick="setLang('zh')">繁體中文</button>
  </div>
</div>

<div class="wrap">
<div class="layout">
  <aside class="sidebar">
    <div>
      <div class="sidebar-label" data-i18n="sidebar_files">データファイル</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".csv,.tsv" multiple>
        <div class="drop-icon">📂</div>
        <div class="drop-text">
          <strong data-i18n="drop_cta">CSVをドロップ</strong><br>
          <span data-i18n="drop_sub">またはクリックして選択</span>
        </div>
      </div>
    </div>
    <div class="file-list" id="fileList"></div>
    <div id="joinBtnWrap" style="display:none">
      <button class="sidebar-join-btn" onclick="showJoin()">🔗 JOIN / 結合分析</button>
    </div>
  </aside>

  <main class="main">
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon">📊</div>
      <h2 data-i18n="welcome_title">CSVファイルをアップロード</h2>
      <p data-i18n="welcome_desc">左パネルにCSVをドロップするか、クリックして選択してください。顧客ID・会員データ・販売データなど、各ファイルの構造を即座に可視化します。</p>
    </div>
    <div id="analyzeArea" style="display:none"></div>
    <div id="joinArea" style="display:none"></div>
  </main>
</div>
</div>

<script>
// ── i18n ─────────────────────────────────────
const I18N={
  ja:{

    tab_overview:'📊 概要',tab_columns:'🔍 カラム分析',tab_chart:'📈 チャート',

  zh:{

    welcome_title:'請上傳 CSV 檔案',

    tab_overview:'📊 概覽',tab_columns:'🔍 欄位分析',tab_chart:'📈 圖表',
    tab_data:'📋 資料瀏覽',tab_nulls:'⚠️ NULL分析',
    kpi_rows:'總筆數',kpi_cols:'欄位數',kpi_num:'數值型',kpi_str:'文字型',kpi_date:'日期型',kpi_null:'含NULL欄位',
    sec_col_list:'欄位清單',sec_col_detail:'全欄位詳細',sec_num_dist:'數值欄位 — 分布',
    sec_top_vals:'類別分布（高頻值）',sec_null_hm:'NULL率熱圖',
    col_no:'#',col_name:'欄位名稱',col_type:'型態',col_null:'NULL率',col_unique:'唯一值數',col_sample:'範例值',
    search_ph:'🔍  搜尋資料...',btn_prev:'← 上頁',btn_next:'下頁 →',
    null_legend:'🟢 正常（0-5%）　🟡 注意（5-20%）　🔴 需確認（20%以上）',
    insight_label:'洞察 / 解讀',no_data:'無資料',

// ── UTF-7 decoder ─────────────────────────────
// UTF-7は +Base64- 形式でUnicode文字を表現する。
// ITシステムが生成するCSVでカラム名が文字化けする主原因。
function decodeUTF7(str){
  // +- は literal +
  // +base64encoded- はUTF-16BE → Unicode変換
  return str.replace(/\+([A-Za-z0-9+/]*)-?/g,(match,b64)=>{
    if(b64==='')return'+'; // ++ → +
    try{
      // Base64 → bytes
      const bin=atob(b64);
      let out='';
      for(let i=0;i+1<bin.length;i+=2){
        const cp=(bin.charCodeAt(i)<<8)|bin.charCodeAt(i+1);
        out+=String.fromCodePoint(cp);
      }
      return out;
    }catch(e){return match;}
  });
}
function isUTF7Like(txt){
  // ヘッダー行に +Xxxx- パターンが2件以上あればUTF-7と判定
  const firstLine=txt.split(/\r?\n/)[0]||'';
  return(firstLine.match(/\+[A-Za-z0-9+/]+-/g)||[]).length>=2;
}
function normalizeText(txt){
  return isUTF7Like(txt)?decodeUTF7(txt):txt;
}

// ── parse ─────────────────────────────────────
function detectType(vals){
  const nn=vals.filter(v=>v!=null&&v!=='');
  if(!nn.length)return'str';
  if(nn.filter(v=>!isNaN(parseFloat(v))&&isFinite(v)).length/nn.length>.8)return'num';
  if(nn.filter(v=>{const d=new Date(v);return!isNaN(d)&&/\d{4}/.test(String(v));}).length/nn.length>.7)return'date';
  if(nn.filter(v=>['true','false','是','否','1','0','Y','N','y','n'].includes(String(v).trim().toLowerCase())).length/nn.length>.9)return'bool';
  return'str';
}
function parseCSV(txt){
  txt=normalizeText(txt);
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return{columns:[],data:[]};
  const sep=(lines[0].match(/\t/g)||[]).length>(lines[0].match(/,/g)||[]).length?'\t':',';
  const row=l=>{const c=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'&&!q){q=true;continue;}if(ch==='"'&&q&&l[i+1]==='"'){cur+='"';i++;continue;}if(ch==='"'&&q){q=false;continue;}if(ch===sep&&!q){c.push(cur);cur='';continue;}cur+=ch;}c.push(cur);return c;};
  const hdr=row(lines[0]).map(h=>h.trim());
  const data=[];
  for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const cells=row(lines[i]);const r={};hdr.forEach((h,j)=>{const v=cells[j]!=null?cells[j].trim():'';r[h]=v===''?null:v;});data.push(r);}
  return{columns:hdr,data};
}
function analyze(col,data){
  const vals=data.map(r=>r[col]);
  const total=vals.length;
  const nulls=vals.filter(v=>v==null||v==='').length;
  const nn=vals.filter(v=>v!=null&&v!=='');
  const unique=new Set(nn).size;
  const type=detectType(nn.slice(0,500));
  const nullPct=total?nulls/total*100:0;
  const uniquePct=nn.length?unique/nn.length*100:0;
  let stats={};
  if(type==='num'){const nums=nn.map(v=>parseFloat(v)).filter(v=>!isNaN(v));if(nums.length){nums.sort((a,b)=>a-b);stats={min:nums[0],max:nums[nums.length-1],mean:nums.reduce((a,b)=>a+b,0)/nums.length,median:nums[Math.floor(nums.length/2)]};}}
  const sample=[...new Set(nn.slice(0,100))].slice(0,6).map(v=>String(v).length>30?String(v).slice(0,28)+'…':String(v));
  let topVals=[];
  if(type==='str'&&unique<=60){const f={};nn.forEach(v=>{f[v]=(f[v]||0)+1;});topVals=Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,8);}
  return{col,type,total,nulls,nullPct,unique,uniquePct,stats,sample,topVals};
}
function histBins(vals,bins=18){
  const nums=vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if(!nums.length)return[];
  const mn=Math.min(...nums),mx=Math.max(...nums);
  if(mn===mx)return[nums.length];
  const w=(mx-mn)/bins,c=Array(bins).fill(0);
  nums.forEach(v=>{let i=Math.floor((v-mn)/w);if(i===bins)i--;c[i]++;});
  return c;
}

function renderCharts(analyzed,numCols,catCols){
  const macarons=[css('--m-sky'),css('--m-peach'),css('--m-mint'),css('--m-lavender'),css('--m-pink'),css('--m-lemon')];

      options:{...baseOpts,plugins:{...baseOpts.plugins,tooltip:{callbacks:{label:ctx=>` ${ctx.parsed.y}件`}}}}

  });

  catCols.slice(0,6).forEach((a,i)=>{
    const lbls=a.topVals.map(([k])=>k.length>14?k.slice(0,12)+'…':k);
    const vals=a.topVals.map(([,v])=>v);
    safeChart(`cvs-c${i}`,()=>({
      type:'bar',
      data:{labels:lbls,datasets:[{data:vals,backgroundColor:lbls.map((_,j)=>macarons[j%macarons.length]),borderRadius:2,borderWidth:0}]},
      options:{...baseOpts,indexAxis:'y',plugins:{...baseOpts.plugins,tooltip:{callbacks:{label:ctx=>` ${ctx.parsed.x.toLocaleString()}件`}}},scales:{x:{grid:{color:'rgba(0,0,0,.06)'},ticks:{font:{size:10},color:css('--text3')}},y:{grid:{display:false},ticks:{font:{size:10},color:css('--text1')}}}}
    }),()=>`<table class="std">${a.topVals.map(([k,v])=>`<tr><td>${k}</td><td class="num">${v.toLocaleString()}</td></tr>`).join('')}</table>`);
  });
}

function renderJoin(){
  const ja=document.getElementById('joinArea');
  if(!ja)return;
  if(S.files.length<2){
    ja.innerHTML=`<div class="join-panel"><p style="color:var(--text3);padding:20px">${t('join_need2')}</p></div>`;
    return;
  }
  const fileOpts=S.files.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');
  const li=JS.leftIdx>=0&&JS.leftIdx<S.files.length?JS.leftIdx:0;
  const ri=JS.rightIdx>=0&&JS.rightIdx<S.files.length?JS.rightIdx:Math.min(1,S.files.length-1);
  const lCols=S.files[li]?S.files[li].columns:[];
  const rCols=S.files[ri]?S.files[ri].columns:[];
  const colOpts=cols=>cols.map(c=>`<option value="${c}">${c}</option>`).join('');

  ja.innerHTML=`<div class="join-panel">
    <h2>🔗 ${t('join_title')}</h2>
    <div class="sub">${t('join_sub')}</div>

    <div class="join-block">
      <h3>① ${LANG==='ja'?'テーブル選択':'資料表選擇'}</h3>
      <div class="join-row">
        <label>${t('join_left')}</label>
        <select class="join-select" id="jLeftFile" onchange="onJoinFileChange()">
          ${S.files.map((f,i)=>`<option value="${i}" ${i===li?'selected':''}>${f.name}</option>`).join('')}
        </select>
      </div>
      <div class="join-row">
        <label>${t('join_right')}</label>
        <select class="join-select" id="jRightFile" onchange="onJoinFileChange()">
          ${S.files.map((f,i)=>`<option value="${i}" ${i===ri?'selected':''}>${f.name}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="join-block">
      <h3>② ${LANG==='ja'?'キー列指定':'鍵欄位指定'}</h3>
      <div class="join-row">
        <label>${t('join_lkey')}</label>
        <select class="join-select" id="jLeftKey">${colOpts(lCols)}</select>
      </div>
      <div class="join-row">
        <label>${t('join_rkey')}</label>
        <select class="join-select" id="jRightKey">${colOpts(rCols)}</select>
      </div>
    </div>

    <div class="join-block">
      <h3>③ ${t('join_type')}</h3>
      <div class="join-type-group">
        <button class="jtype-btn${JS.joinType==='left'?' active':''}" onclick="setJoinType('left')">LEFT JOIN</button>
        <button class="jtype-btn${JS.joinType==='inner'?' active':''}" onclick="setJoinType('inner')">INNER JOIN</button>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">
        ${JS.joinType==='left'
          ?(LANG==='ja'?'左テーブル全件 + 右テーブルはマッチした行のみ付加':'左資料表全部保留，右資料表只附加匹配行')
          :(LANG==='ja'?'両方にある顧客IDのみ残す':'只保留兩側都存在的顧客ID')}
      </div>
    </div>

    <button class="join-run-btn" onclick="doJoin()">▶ ${t('join_run')}</button>

    <div id="joinResultArea"></div>
  </div>`;

  // restore key selections if available
  if(JS.leftKey){const s=document.getElementById('jLeftKey');if(s&&[...s.options].some(o=>o.value===JS.leftKey))s.value=JS.leftKey;}
  if(JS.rightKey){const s=document.getElementById('jRightKey');if(s&&[...s.options].some(o=>o.value===JS.rightKey))s.value=JS.rightKey;}

  if(JS.result)renderJoinResult();
}

function onJoinFileChange(){
  const li=parseInt(document.getElementById('jLeftFile').value);
  const ri=parseInt(document.getElementById('jRightFile').value);
  JS.leftIdx=li;JS.rightIdx=ri;JS.result=null;
  // rebuild key selects
  const lCols=S.files[li]?S.files[li].columns:[];
  const rCols=S.files[ri]?S.files[ri].columns:[];
  const colOpts=(cols,id)=>{const s=document.getElementById(id);if(!s)return;s.innerHTML=cols.map(c=>`<option value="${c}">${c}</option>`).join('');};
  colOpts(lCols,'jLeftKey');colOpts(rCols,'jRightKey');
  // auto-match key by name
  autoMatchKey(lCols,rCols);
}

function autoMatchKey(lCols,rCols){
  // 共通カラム名を自動検出（顧客ID優先）
  const priority=['客戶ID','顧客ID','customer_id','客户id','LINE ID','id'];
  for(const p of priority){
    const lm=lCols.find(c=>c.toLowerCase()===p.toLowerCase());
    const rm=rCols.find(c=>c.toLowerCase()===p.toLowerCase());
    if(lm&&rm){
      const ls=document.getElementById('jLeftKey');const rs=document.getElementById('jRightKey');
      if(ls)ls.value=lm;if(rs)rs.value=rm;return;
    }
  }
  // 部分一致
  for(const lc of lCols){
    const rm=rCols.find(c=>c.toLowerCase()===lc.toLowerCase());
    if(rm){
      const ls=document.getElementById('jLeftKey');const rs=document.getElementById('jRightKey');
      if(ls)ls.value=lc;if(rs)rs.value=rm;return;
    }
  }
}

function setJoinType(type){
  JS.joinType=type;JS.result=null;renderJoin();
}

function doJoin(){
  const li=parseInt(document.getElementById('jLeftFile').value);
  const ri=parseInt(document.getElementById('jRightFile').value);
  const lk=document.getElementById('jLeftKey').value;
  const rk=document.getElementById('jRightKey').value;
  if(li===ri){alert(LANG==='ja'?'左右に同じファイルを選択しています':'左右選擇了相同的檔案');return;}
  if(!lk||!rk){alert(LANG==='ja'?'キー列を選択してください':'請選擇鍵欄位');return;}

  JS.leftIdx=li;JS.rightIdx=ri;JS.leftKey=lk;JS.rightKey=rk;

  const lData=S.files[li].data;const rData=S.files[ri].data;
  const lCols=S.files[li].columns;const rCols=S.files[ri].columns;

  // 右テーブルをキーでMap化
  const rMap=new Map();
  rData.forEach(row=>{
    const k=row[rk];
    if(k==null)return;
    const key=String(k).trim();
    if(!rMap.has(key))rMap.set(key,[]);
    rMap.get(key).push(row);
  });

  // 右テーブルの重複しないカラム（キー列は除く）
  const rExtraCols=rCols.filter(c=>c!==rk&&!lCols.includes(c));
  const allCols=[...lCols,...rExtraCols];

  const joined=[];
  let matched=0;
  lData.forEach(lrow=>{
    const k=lrow[lk];const key=k!=null?String(k).trim():null;
    const rrows=key?rMap.get(key):null;
    if(rrows&&rrows.length>0){
      matched++;
      rrows.forEach(rrow=>{
        const merged={...lrow};
        rExtraCols.forEach(c=>{merged[c]=rrow[c]??null;});
        joined.push(merged);
      });
    } else {
      if(JS.joinType==='left'){
        const merged={...lrow};
        rExtraCols.forEach(c=>{merged[c]=null;});
        joined.push(merged);
      }
    }
  });

  const matchPct=lData.length?matched/lData.length*100:0;
  const unmatched=lData.length-matched;

  JS.result={data:joined,columns:allCols,matchPct,matched,unmatched,lFile:S.files[li].name,rFile:S.files[ri].name,lKey:lk,rKey:rk};
  renderJoinResult();
}

function renderJoinResult(){
  const r=JS.result;if(!r)return;
  const ra=document.getElementById('joinResultArea');if(!ra)return;
  const warnHtml=r.matchPct<50?`<div class="join-warn">⚠ ${LANG==='ja'?`マッチ率が${r.matchPct.toFixed(1)}%と低いです。キー列の値の形式が異なる可能性があります（例：スペース・大文字小文字・全角半角）。`:`匹配率僅${r.matchPct.toFixed(1)}%，鍵值格式可能不一致（空格、大小寫、全半形等）。`}</div>`:'';
  ra.innerHTML=`
    <div style="margin-top:20px">
      <div class="section-title">${t('join_result')}</div>
      ${warnHtml}
      <div class="join-result-info">
        <div class="ri">${t('join_rows')}: <strong>${r.data.length.toLocaleString()}</strong></div>
        <div class="ri">${t('join_cols')}: <strong>${r.columns.length}</strong></div>
        <div class="ri">${t('join_matched')}: <strong>${r.matchPct.toFixed(1)}%</strong></div>
        <div class="ri">${t('join_unmatched')}: <strong>${r.unmatched.toLocaleString()}</strong></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="dl-btn" onclick="showJoinTable()">📋 ${t('join_dl_view')}</button>
        <button class="dl-btn" onclick="downloadJoinCSV()">⬇ ${t('join_dl_csv')}</button>
      </div>
      <div id="joinTableArea"></div>
    </div>`;
}

function showJoinTable(){
  const r=JS.result;if(!r)return;
  const el=document.getElementById('joinTableArea');if(!el)return;
  const PAGE=100;
  const slice=r.data.slice(0,PAGE);
  el.innerHTML=`
    <div class="table-wrap"><table class="std">
      <thead><tr><th class="num">#</th>${r.columns.map(c=>`<th title="${c}">${c.length>16?c.slice(0,14)+'…':c}</th>`).join('')}</tr></thead>
      <tbody>${slice.map((row,i)=>`<tr><td class="num" style="color:var(--text3)">${i+1}</td>${r.columns.map(c=>{const v=row[c];if(v==null||v==='')return`<td><span style="color:var(--text3);font-style:italic;font-size:11px">null</span></td>`;const d=String(v).length>28?String(v).slice(0,26)+'…':String(v);return`<td title="${String(v)}">${d}</td>`;}).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${r.data.length>PAGE?`<div style="font-size:11px;color:var(--text3);padding:8px 0">${LANG==='ja'?`先頭${PAGE}件を表示（全${r.data.length.toLocaleString()}件）。全件はCSVダウンロードで確認。`:`顯示前${PAGE}筆（共${r.data.length.toLocaleString()}筆）。全部請下載CSV。`}</div>`:''}
  `;
}

function downloadJoinCSV(){
  const r=JS.result;if(!r||!r.data.length)return;
  const esc=v=>{const s=v==null?'':String(v);return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s;};
  const lines=[r.columns.map(esc).join(','),...r.data.map(row=>r.columns.map(c=>esc(row[c])).join(','))];
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`joined_${r.lFile.replace('.csv','')}_x_${r.rFile.replace('.csv','')}.csv`;
  a.click();URL.revokeObjectURL(a.href);
}

// ── load files ────────────────────────────────
// 文字コード試行順: UTF-8 → Shift-JIS → Big5
// さらにUTF-7パターンを自動検出してデコード
function tryReadFile(file,encodings,cb){
  const enc=encodings.shift();
  if(!enc){cb(null);return;}
  const r=new FileReader();
  r.onload=e=>{
    const txt=e.target.result;
    // 文字化け簡易チェック: 置換文字(U+FFFD)が多すぎる場合は次のエンコードを試す
    const badRatio=(txt.match(/\ufffd/g)||[]).length/Math.max(txt.length,1);
    if(badRatio>0.02&&encodings.length>0){tryReadFile(file,encodings,cb);}
    else{cb(txt);}
  };
  r.onerror=()=>{if(encodings.length>0)tryReadFile(file,encodings,cb);else cb(null);};
  r.readAsText(file,enc);
}
function loadFiles(files){
  Array.from(files).forEach(file=>{
    if(!file.name.match(/\.(csv|tsv)$/i))return;
    tryReadFile(file,['UTF-8','Shift-JIS','Big5'],txt=>{
      if(!txt)return;
      const{columns,data}=parseCSV(txt);
      if(!columns.length)return;
      const ex=S.files.findIndex(f=>f.name===file.name);if(ex>=0)S.files.splice(ex,1);
      S.files.push({name:file.name,columns,data,tab:'overview',_page:1,_filter:null});
      S.activeIdx=S.files.length-1;renderFileList();renderMain();
    });
  });
}
document.getElementById('fileInput').addEventListener('change',e=>loadFiles(e.target.files));
const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');loadFiles(e.dataTransfer.files);});
</script>
